; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = black_f407vg

[env]
platform = ststm32
framework = arduino
monitor_speed = 115200
monitor_port = COM4
upload_protocol = custom
upload_command = "C:\Program Files\STMicroelectronics\STM32Cube\STM32CubeProgrammer\bin\STM32_Programmer_CLI.exe" -c port=SWD freq=4000 -w "$BUILD_DIR\firmware.elf" -v -rst
build_flags =
  -DSERIAL_RX_BUFFER_SIZE=512
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ST7735 and ST7789 Library

[env:black_f407ve]
board = black_f407ve

[env:black_f407vg]
board = black_f407vg
